name: ds-playground
on: push
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ds_playground
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: sh tools/verify.sh
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ds_playground
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ds_playground/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xdotool wmctrl openbox
          cargo install tauri-driver --version 2.1.0 --locked
      - run: uv sync --frozen
      - run: make desktop-build
      - run: pnpm --dir desktop exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox & make e2e'
      - if: runner.os != 'Linux'
        run: make e2e
